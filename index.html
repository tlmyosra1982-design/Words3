
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#100b18">
<title>YOSRA | Value of Knowledge</title>

<style>
:root{
--bg:#100b18;
--panel:#21172d;
--panel2:#30213e;
--purple:#a77be0;
--gold:#e8c77b;
--cream:#fff5e8;
--muted:#c4b5ce;
--green:#8ed5ad;
--red:#ed8996;
}
*{box-sizing:border-box}
body{
margin:0;padding:14px;background:var(--bg);
color:var(--cream);font-family:Tahoma,Arial,sans-serif;
min-height:100vh;
}
header{text-align:center;padding:22px 5px}
.brand{letter-spacing:6px;color:var(--gold);font-size:14px}
h1{font-size:25px;margin:13px 0 7px}
.subtitle{color:var(--muted);font-size:13px}
.stats{
display:flex;justify-content:center;gap:8px;
flex-wrap:wrap;margin:18px 0
}
.stat{
background:var(--panel);border:1px solid #493558;
border-radius:13px;padding:10px 15px;
color:var(--muted);font-size:12px
}
.stat b{
display:block;color:var(--gold);
font-size:19px;margin-top:5px
}
main{max-width:680px;margin:auto}
nav{
display:grid;grid-template-columns:repeat(3,1fr);
gap:7px;margin-bottom:15px
}
button{font-family:inherit;cursor:pointer}
nav button,.btn{
background:var(--panel);border:1px solid #59436d;
color:var(--cream);border-radius:12px;
padding:12px 7px;font-size:13px
}
nav button.active,.primary{
background:linear-gradient(135deg,#76519b,#a77be0);
border-color:var(--purple);color:white
}
.panel{
background:var(--panel);border:1px solid #493558;
border-radius:20px;padding:17px;margin-bottom:14px
}
.heading{color:var(--gold);font-size:17px;margin-bottom:14px}
.word-card{
background:linear-gradient(145deg,#382448,#21172d);
border:1px solid #73558e;border-radius:18px;
padding:25px 12px;text-align:center;margin:14px 0
}
.word{
font-size:31px;font-weight:bold;
color:var(--gold);direction:ltr
}
.meaning{font-size:19px;margin:16px 0;line-height:1.9}
.definition{
direction:ltr;text-align:center;line-height:1.9;
color:#ded1e8;font-size:14px;margin:12px 0
}
.counter{font-size:12px;color:var(--muted);margin:8px}
.tag{
display:inline-block;background:#493258;
color:#e8d4ff;border-radius:8px;
padding:5px 10px;font-size:11px;margin:4px;
direction:ltr
}
.actions{
display:flex;justify-content:center;
gap:8px;flex-wrap:wrap;margin-top:13px
}
.btn{padding:11px 14px}
.btn.gold{color:var(--gold);border-color:var(--gold)}
.progress{
height:7px;background:#392a46;
border-radius:20px;overflow:hidden;margin:12px 0
}
.progress div{
height:100%;background:var(--gold);
width:0%;transition:.3s
}
.hidden{display:none!important}
input{
width:100%;padding:14px;border-radius:12px;
border:1px solid #654b79;background:#160f20;
color:white;font-size:15px;outline:none
}
input::placeholder{color:#a99bb5}
.word-list{display:grid;gap:8px;margin-top:12px}
.item{
display:flex;align-items:center;justify-content:space-between;
gap:10px;padding:12px;background:var(--panel2);
border:1px solid #483455;border-radius:12px
}
.item .en{
direction:ltr;text-align:left;
font-weight:bold;color:var(--gold);font-size:16px
}
.item .fa{font-size:12px;color:var(--muted);margin-top:5px}
.item .definition{
text-align:left;font-size:12px;margin:5px 0
}
.small-btn{
border:1px solid #765994;color:#e5c9ff;
background:#30213e;border-radius:9px;padding:9px 12px
}
.option{
width:100%;display:block;margin:9px 0;
padding:14px;border-radius:12px;
border:1px solid #634b75;background:#30213e;
color:white;font-size:14px
}
.option.correct{background:#24543e;border-color:var(--green)}
.option.wrong{background:#632d3a;border-color:var(--red)}
.feedback{text-align:center;min-height:28px;margin:12px;color:var(--gold)}
footer{
text-align:center;color:#8c7b99;
font-size:11px;padding:20px;line-height:2
}
button:disabled{opacity:.45;cursor:not-allowed}
</style>
</head>

<body>

<header>
<div class="brand">Y O S R A</div>
<h1>✨ Value of Knowledge</h1>
<div class="subtitle">VISION 1 · LESSON 3 · ENGLISH VOCABULARY</div>

<div class="stats">
<div class="stat">تعداد واژگان<b id="total">0</b></div>
<div class="stat">امتیاز<b id="score">0</b></div>
<div class="stat">یادگیری<b id="learned">0</b></div>
</div>
</header>

<main>

<nav>
<button class="active" onclick="showTab('cards',this)">📚 فلش‌کارت</button>
<button onclick="showTab('list',this)">📖 فهرست لغات</button>
<button onclick="showTab('quiz',this)">🏆 آزمون</button>
</nav>

<section id="cards">
<div class="panel">
<div class="heading">✨ Vocabulary Learning</div>

<div class="counter" id="counter">1</div>
<div class="progress"><div id="cardProgress"></div></div>

<div class="word-card">
<div class="word" id="word"></div>

<div class="actions">
<button class="btn primary" onclick="speak(current.word)">🔊 تلفظ انگلیسی</button>
<button class="btn" onclick="speak(current.word)">🇺🇸 American Voice</button>
</div>

<div class="meaning" id="meaning"></div>
<div class="definition" id="definition"></div>
<div id="tags"></div>
</div>

<div class="actions">
<button class="btn" onclick="previous()">❮ قبلی</button>
<button class="btn gold" onclick="toggleMeaning()">نمایش / مخفی کردن معنی</button>
<button class="btn primary" onclick="next()">بعدی ❯</button>
</div>

<div class="actions">
<button class="btn" onclick="speak(current.definition)">🔊 شنیدن تعریف</button>
<button class="btn" onclick="markLearned()">✓ یاد گرفتم</button>
</div>
</div>
</section>

<section id="list" class="hidden">
<div class="panel">
<div class="heading">📖 Vocabulary Dictionary</div>
<input id="search" placeholder="جست‌وجوی واژه انگلیسی یا معنی فارسی..." oninput="renderList()">
<div class="word-list" id="wordList"></div>
</div>
</section>

<section id="quiz" class="hidden">
<div class="panel">
<div class="heading">🏆 Vocabulary Challenge</div>
<p style="color:var(--muted);font-size:13px">
معنی درست واژه را انتخاب کن.
</p>

<div class="progress"><div id="quizProgress"></div></div>

<div id="quizArea">
<div class="word-card">
<div class="counter" id="questionNumber"></div>
<div class="word" id="questionWord"></div>
<div class="actions">
<button class="btn" onclick="speak(quizCurrent[0])">🔊 تلفظ واژه</button>
</div>
</div>

<div id="options"></div>
<div class="feedback" id="feedback"></div>

<button class="btn primary" id="nextQuestion"
onclick="nextQuestion()" style="width:100%">
سؤال بعدی ❯
</button>
</div>

<div id="quizResult" class="hidden" style="text-align:center;padding:25px">
<h2 style="color:var(--gold)">🎉 آفرین!</h2>
<p id="resultText"></p>
<button class="btn primary" onclick="startQuiz()">شروع دوباره</button>
</div>

</div>
</section>

</main>

<footer>
YOSRA MASTER ENGINE · V1.0.0<br>
VALUE OF KNOWLEDGE · LESSON 03
</footer>

<script>

/* ==================================
   YOSRA VOCABULARY DATABASE
   VISION 1 - LESSON 3
================================== */

const data=[

["action","عمل، اقدام","SYN deed, act"],
["age","سن، دوره","SYN lifetime"],
["airplane","هواپیما","SYN aero plane"],
["alone","تنها","if you are alone, there is no one with you SYN only, single"],
["ashamed","شرمنده، خجالت‌زده","SYN embarrassed, sorry"],
["at once","فورا","SYN immediately"],
["attend","حاضر شدن، شرکت کردن","SYN be present, participate"],
["background","دوران، زمینه","the situation or past events that explain why sth happens"],
["behave","رفتار کردن","SYN treat, act, perform"],
["belief","اعتقاد، باور، ایمان","the feeling that something is definitely true or definitely exists"],
["believe","باور کردن، اعتقاد داشتن","to think that sth is true or real"],
["build","ساختن، بنا کردن","to make sth"],
["bulb","لامپ","light bulb"],
["change","تغییر دادن، تغییر","SYN differ, convert"],
["clap","کف زدن، دست زدن","SYN applaud"],
["column","ستون","a vertical list or row"],
["cradle","گهواره","a baby's bed"],
["dear","عزیز، گرامی","loved or precious"],
["description","توصیف، شرح","SYN explanation, interpretation"],
["develop","پیشرفت کردن، توسعه دادن","to grow or change into a better form SYN advance, progress"],
["device","ابزار، وسیله","SYN tool"],
["during","در طول، در طی","SYN within, pending"],
["emotion","احساس، عاطفه","SYN feeling"],
["emphasize","تأکید کردن","SYN stress, give priority to, highlight"],
["energetic","پرانرژی، فعال","having a lot of energy"],
["experiment","آزمایش","SYN examination, research"],
["express","بیان کردن","SYN give, tell, represent, say"],
["face","صورت، چهره / روبرو شدن","the front part of your body / SYN deal with, encounter"],
["famous","مشهور","SYN well-known, celebrity"],
["far","دور","SYN remote, distant, faraway"],
["feel (weak)","احساس (ضعف) کردن","SYN sense, perceive"],
["flu","آنفلوآنزا","SYN influenza"],
["fortunately","خوشبختانه","SYN luckily ANT unfortunately"],
["gain","به دست آوردن، کسب کردن","SYN achieve, obtain, acquire, attain, collect, gather, reach"],

["get around","شایع شدن، پراکنده شدن","SYN spread"],
["give up","رها کردن، ترک کردن","SYN quit, abandon"],
["grave","قبر","burying place SYN tomb"],
["grow up","بزرگ شدن، رشد کردن","to become older"],
["happen","اتفاق افتادن","SYN occur"],
["hearing","شنوایی","the ability to perceive sound"],
["heavily","شدتاً، سنگینی","ANT lightly"],
["history","تاریخ، تاریخچه","The past events"],
["hit","ضربه زدن، اصابت کردن","SYN strike, beat, bang, collide"],
["holy","مقدس","connected with God and religion"],
["injured","زخمی، مجروح","SYN hurt, broken, damaged"],

["insect","حشره","SYN bug"],
["interview","مصاحبه کردن","SYN meeting"],
["invent","اختراع کردن","to design or create sth for the first time"],
["jump","پریدن","SYN leap"],
["key","کلید","SYN solution, answer"],
["kill","کشتن","to cause to die"],
["knowledge","دانش، علم","understanding of a subject"],
["laboratory","آزمایشگاه، لابراتوار","a building or room for doing scientific activities"],
["leave","ترک کردن، رها کردن","SYN quit, give up, abandon"],
["meal","غذا","SYN food"],
["medicine","دارو، پزشکی","SYN cure, drug"],
["memory","حافظه","the ability to remember things, places, experiences"],
["modern","مدرن، جدید","SYN fresh, new, recent, contemporary ANT old, traditional"],
["narrate","روایت کردن، نقل کردن","to tell something"],
["negative","منفی","ANT positive"],
["noise","سر و صدا","SYN sound"],
["novel","رمان","a long story"],
["observe","مشاهده کردن","SYN see, discover, notice"],
["pain","درد","SYN hurt, ache"],
["pass away","فوت کردن","SYN die"],
["patient","بیمار","sick person"],
["peace","صلح، آرامش","SYN calm, quiet"],
["personality","شخصیت","SYN character, identity"],
["poem","شعر","SYN verse, lyric"],
["poet","شاعر","someone who writes poem"],
["possible","ممکن، مقدور","can be done or achieve SYN potential ANT impossible"],
["prepare","آماده کردن، تدارک دیدن","SYN make or get ready, arrange"],
["prophet","پیامبر","a man who people believe has been sent by God"],

["publish","منتشر کردن","SYN put out, print, produce"],
["put aside","کنار گذاشتن","to save for a future time SYN leave, reserve, save"],
["quit","دست کشیدن، ترک کردن","SYN abandon, give up, leave"],
["rapidly","به سرعت، تند","SYN swiftly, quickly, speedily, hastily"],
["recite","از بر خواندن","to say something you have learned for other SYN repeat"],
["refinery","پالایشگاه، تصفیه‌خانه","a factory where something such as oil is made"],
["relate","ارتباط دادن، مرتبط ساختن","SYN associate, connect, link"],
["remember","به یاد آوردن، به یاد داشتن","to bring information that you know into your mind"],
["research","تحقیق کردن","SYN v: investigate, analyses, explore, probe, study, examine"],
["respect","احترام گذاشتن","SYN admire, honor"],
["sadly","متأسفانه","SYN unfortunately"],
["seek","جست‌وجو کردن","SYN look for, be after, search"],
["situation","موقعیت، وضعیت","SYN state, location, position, site"],
["skill","مهارت","an ability to do sth well SYN expertise, ability, craft, talent"],
["smoking","سیگار کشیدن","inhaling and exhaling of smoke from a cigarette"],
["solve","حل کردن","to find or provide a way of dealing with a problem"],
["special","خاص، مخصوص","SYN specific, particular"],
["state","اسم: حالت / فعل: بیان کردن","Noun: condition   Verb: assert, declare, say"],
["strong","قوی","SYN powerful"],
["success","موفقیت، کامیابی","SYN luck, fortunate"],
["suddenly","ناگهان","SYN abruptly, unexpectedly"],
["think","فکر کردن، اندیشیدن","to use the power of the mind"],
["thinker","اندیشمند، متفکر","SYN philosopher, wise man"],
["translate","ترجمه کردن","to change written or spoken words into another language SYN interpret"],
["translator","مترجم","a person who translates"],
["try","تلاش کردن، سعی کردن","SYN attempt, make an effort, struggle"],
["university","دانشگاه","an educational institution at the highest level"],
["value","ارزش، قدر، اهمیت","the importance or worth of sth for someone"],
["weak","ضعیف، ناتوان","ANT strong, powerful"],
["wait","صبر کردن، منتظر ماندن","SYN remain, stay"]

];

/* ==================================
   GENERAL SETTINGS
================================== */

let index=0;
let current=null;
let revealed=true;
let score=0;
let learned=new Set();

document.getElementById("total").textContent=data.length;

/* ==================================
   ENGLISH PRONUNCIATION
================================== */

function speak(text){

 if(!("speechSynthesis" in window)){
  alert("مرورگر شما از تلفظ صوتی پشتیبانی نمی‌کند.");
  return;
 }

 speechSynthesis.cancel();

 const u=new SpeechSynthesisUtterance(text);
 u.lang="en-US";
 u.rate=.82;
 u.pitch=1;

 const voices=speechSynthesis.getVoices();

 const voice=
 voices.find(v=>v.lang==="en-US")||
 voices.find(v=>v.lang.startsWith("en"));

 if(voice)u.voice=voice;

 speechSynthesis.speak(u);
}

/* ==================================
   FLASHCARDS
================================== */

function parseWord(item){
 return{
  word:item[0],
  fa:item[1],
  definition:item[2]
 };
}

function updateCard(){

 current=parseWord(data[index]);

 document.getElementById("word").textContent=current.word;
 document.getElementById("meaning").textContent=current.fa;
 document.getElementById("definition").textContent=current.definition;

 document.getElementById("counter").textContent=
 (index+1)+" / "+data.length;

 document.getElementById("cardProgress").style.width=
 ((index+1)/data.length*100)+"%";

 const tags=[];

 if(/\bSYN\b/.test(current.definition))
 tags.push('<span class="tag">SYN · Synonym</span>');

 if(/\bANT\b/.test(current.definition))
 tags.push('<span class="tag">ANT · Antonym</span>');

 document.getElementById("tags").innerHTML=tags.join("");

 document.getElementById("meaning").classList.toggle("hidden",!revealed);
}

function next(){
 index=(index+1)%data.length;
 revealed=true;
 updateCard();
}

function previous(){
 index=(index-1+data.length)%data.length;
 revealed=true;
 updateCard();
}

function toggleMeaning(){
 revealed=!revealed;
 document.getElementById("meaning").classList.toggle("hidden",!revealed);
}

function markLearned(){
 learned.add(current.word);
 document.getElementById("learned").textContent=learned.size;
 next();
}

/* ==================================
   NAVIGATION
================================== */

function showTab(id,btn){

 ["cards","list","quiz"].forEach(x=>{
  document.getElementById(x).classList.add("hidden");
 });

 document.getElementById(id).classList.remove("hidden");

 document.querySelectorAll("nav button").forEach(x=>{
  x.classList.remove("active");
 });

 btn.classList.add("active");

 if(id==="list")renderList();
 if(id==="quiz"&&!quizStarted)startQuiz();
}

/* ==================================
   VOCABULARY DICTIONARY
================================== */

function renderList(){

 const q=document.getElementById("search").value.trim().toLowerCase();

 const filtered=data.filter(x=>
 (x[0]+" "+x[1]+" "+x[2]).toLowerCase().includes(q)
 );

 const list=document.getElementById("wordList");
 list.innerHTML="";

 filtered.forEach(x=>{

  const item=document.createElement("div");
  item.className="item";

  const content=document.createElement("div");

  const en=document.createElement("div");
  en.className="en";
  en.textContent=x[0];

  const fa=document.createElement("div");
  fa.className="fa";
  fa.textContent=x[1];

  const def=document.createElement("div");
  def.className="definition";
  def.textContent=x[2];

  content.append(en,fa,def);

  const btn=document.createElement("button");
  btn.className="small-btn";
  btn.textContent="🔊";
  btn.onclick=()=>speak(x[0]);

  item.append(content,btn);
  list.appendChild(item);

 });

 if(!filtered.length){
  list.textContent="واژه‌ای پیدا نشد.";
 }
}

/* ==================================
   FOUR OPTION QUIZ
================================== */

let quizItems=[];
let quizIndex=0;
let quizScore=0;
let quizCurrent=null;
let answered=false;
let quizStarted=false;

function shuffle(arr){
 return [...arr].sort(()=>Math.random()-.5);
}

function startQuiz(){

 quizItems=shuffle(data);
 quizIndex=0;
 quizScore=0;
 quizStarted=true;

 document.getElementById("quizArea").classList.remove("hidden");
 document.getElementById("quizResult").classList.add("hidden");

 makeQuestion();
}

function makeQuestion(){

 answered=false;
 quizCurrent=quizItems[quizIndex];

 document.getElementById("questionWord").textContent=quizCurrent[0];

 document.getElementById("questionNumber").textContent=
 `سؤال ${quizIndex+1} از ${quizItems.length}`;

 document.getElementById("quizProgress").style.width=
 (quizIndex/quizItems.length*100)+"%";

 document.getElementById("feedback").textContent="";

 const nextBtn=document.getElementById("nextQuestion");
 nextBtn.disabled=true;

 const wrong=shuffle(
 data.filter(x=>x[0]!==quizCurrent[0])
 ).slice(0,3);

 const choices=shuffle([quizCurrent,...wrong]);

 const options=document.getElementById("options");
 options.innerHTML="";

 choices.forEach(x=>{

  const b=document.createElement("button");
  b.className="option";
  b.textContent=x[1];

  b.onclick=()=>answer(b,x);

  options.appendChild(b);
 });
}

function answer(btn,x){

 if(answered)return;

 answered=true;

 document.querySelectorAll(".option").forEach(b=>{

  if(b.textContent===quizCurrent[1]){
   b.classList.add("correct");
  }

 });

 if(x[0]===quizCurrent[0]){

  quizScore++;
  score++;

  document.getElementById("score").textContent=score;

  document.getElementById("feedback").textContent=
  "✓ عالی! پاسخ درست است.";

 }else{

  btn.classList.add("wrong");

  document.getElementById("feedback").textContent=
  "پاسخ درست: "+quizCurrent[1];

 }

 document.getElementById("nextQuestion").disabled=false;
}

function nextQuestion(){

 if(!answered)return;

 quizIndex++;

 if(quizIndex>=quizItems.length){

  document.getElementById("quizArea").classList.add("hidden");
  document.getElementById("quizResult").classList.remove("hidden");

  document.getElementById("resultText").textContent=
  `شما ${quizScore} پاسخ درست از ${quizItems.length} سؤال داشتید.`;

  document.getElementById("quizProgress").style.width="100%";

 }else{

  makeQuestion();

 }
}

/* ==================================
   INITIALIZATION
================================== */

updateCard();

if("speechSynthesis" in window){
 speechSynthesis.getVoices();
}

</script>
</body>
</html>
